<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="./assets/icons/toolCase.svg"
      type="image/x-icon"
    />
    <title>Portfolio - Guillaume Duval</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="hide-on-load">
    <!-- <body class=""> -->
    <header>
      <div class="header__silhouettes">
        <img
          src="./assets/header_cliffs.webp"
          width="448"
          height="160"
          alt="silhouette de falaise"
          class="cliffs-silhouette"
        />
        <div class="alpinist-silhouette">
          <img
            src="./assets/header_alpinist.webp"
            width="448"
            height="160"
            alt="silhouette d'un alpiniste accroché à la falaise"
          />
        </div>
      </div>
      <nav class="header__navigation">
        <div class="section-anchor odd">
          <button
            class="section-anchor__link active"
            data-anchor="presentation"
            data-locked="true"
          >
            Présentation
          </button>
          <div class="section-anchor__borders--left"></div>
          <div class="section-anchor__borders--right"></div>
        </div>
        <div class="section-anchor even">
          <button
            class="section-anchor__link"
            data-anchor="career"
            data-locked="true"
          >
            Parcours
          </button>
          <div class="section-anchor__borders--left"></div>
          <div class="section-anchor__borders--right"></div>
        </div>
        <div class="section-anchor odd">
          <button
            class="section-anchor__link"
            data-anchor="skills"
            data-locked="true"
          >
            Compétences
          </button>
          <div class="section-anchor__borders--left"></div>
          <div class="section-anchor__borders--right"></div>
        </div>
        <div class="section-anchor even">
          <button
            class="section-anchor__link"
            data-anchor="contact"
            data-locked="true"
          >
            Contact
          </button>
          <div class="section-anchor__borders--left"></div>
          <div class="section-anchor__borders--right"></div>
        </div>
      </nav>
    </header>

    <div class="social-links">
      <a
        href="https://fr.linkedin.com/"
        title="Lien vers Linkedin"
        class="social-links__anchor"
        target="_blank"
      >
        <img
          src="./assets/rope-link.webp"
          width="32"
          height="96"
          alt="silhouette d'une corde accrochée à un mousqueton"
          class="social-links__anchor__rope"
        />
        <img
          src="./assets/icons/logo_Linkedin.svg"
          width="32"
          height="32"
          alt="logo de gitHub"
          class="social-links__anchor__logo"
        />
        <div class="social-links__anchor__underline"></div>
      </a>
      <a
        href="https://github.com/guillaume472e44"
        title="Lien vers GitHub"
        class="social-links__anchor"
        target="_blank"
      >
        <img
          src="./assets/rope-link.webp"
          width="32"
          height="96"
          alt="silhouette d'une corde accrochée à un mousqueton"
          class="social-links__anchor__rope"
        />
        <img
          src="./assets/icons/logo_github.svg"
          width="32"
          height="32"
          alt="logo de gitHub"
          class="social-links__anchor__logo"
        />
        <div class="social-links__anchor__underline"></div>
      </a>
    </div>

    <main class="screen">
      <div class="transition-grid"></div>
      <section id="presentation" class="main-content">
        <span class="section-title animate"></span>
        <div class="section-content">
          <img
            src="./assets/severed_workman.webp"
            alt="silhouette d'un costume"
            width="256"
            height="256"
          />
          <div class="section-content--right">
            <h1><span>Guillaume Duval,</span> développeur web Front-End</h1>
            <p>J'aime mettre la <strong>créativité</strong> au service d'interfaces soignées et d'un code propre<strong>.</strong>
            </p>
          </div>
        </div>
      </section>
      <!-- <section id="career" class="main-content">
        <span class="section-title animate"></span>
      </section>
      <section id="skills" class="main-content">
        <span class="section-title animate"></span>
      </section>
      <section id="contact" class="main-content">
        <span class="section-title animate"></span>
      </section> -->
    </main>

    <footer>
      <div class="footer__silhouettes">
        <div class="fire"></div>
        <div class="sun"></div>
        <img
          src="./assets/THX1138.webp"
          width="96"
          height="96"
          alt="silhouette d'un homme devant le soleil couchant"
          class="Thx1138-silhouette"
        />
        <img
          src="./assets/footer_landscape.webp"
          width="1120"
          height="128"
          alt="silhouette d'un paysage lointain de plaine"
          class="landscape-silouhette"
        />
        <img
          src="./assets/footer_caveman.webp"
          width="80"
          height="80"
          alt="silhouette d'un homme des cavernes avec un gourdin"
          class="caveman-silhouette"
        />
      </div>
    </footer>
    <script type="module" src="./scripts/index.js"></script>
  </body>
</html>
