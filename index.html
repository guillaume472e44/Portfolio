<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guillaume Duval</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="header__silhouettes">
        <img
          src="./assets/header_cliffs.webp"
          alt="silhouette de falaise"
          class="cliffs-silhouette hide"
        />
        <div class="alpinist-silhouette hide">
          <img
            src="./assets/header_alpinist.webp"
            alt="silhouette d'un alpiniste accroché à la falaise"
          />
        </div>
      </div>
      <nav class="header__navigation">
        <div class="section-anchor odd hide">
          <button class="section-anchor__link">Accueil</button>
          <div class="section-anchor__borders--left"></div>
          <div class="section-anchor__borders--right"></div>
        </div>
        <div class="section-anchor even hide">
          <button class="section-anchor__link">Présentation</button>
          <div class="section-anchor__borders--left"></div>
          <div class="section-anchor__borders--right"></div>
        </div>
        <div class="section-anchor odd hide">
          <button class="section-anchor__link">Compétences</button>
          <div class="section-anchor__borders--left"></div>
          <div class="section-anchor__borders--right"></div>
        </div>
        <div class="section-anchor even hide">
          <button class="section-anchor__link">Contact</button>
          <div class="section-anchor__borders--left"></div>
          <div class="section-anchor__borders--right"></div>
        </div>
      </nav>
    </header>

    <main></main>

    <footer></footer>
    <script type="module" src="./scripts/index.js"></script>
  </body>
</html>
