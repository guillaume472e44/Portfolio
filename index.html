<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="./assets/icons8-portfolio-16.png"
      type="image/x-icon"
    />
    <title>Portfolio - Guillaume Duval</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <div class="header__silhouettes">
        <img
          src="./assets/header_cliffs.webp"
          alt="silhouette de falaise"
          class="cliffs-silhouette hide"
        />
        <div class="alpinist-silhouette hide">
          <img
            src="./assets/header_alpinist.webp"
            alt="silhouette d'un alpiniste accroché à la falaise"
          />
        </div>
      </div>
      <nav class="header__navigation">
        <div class="section-anchor odd hide">
          <button class="section-anchor__link active" data-anchor="home">
            Accueil
          </button>
          <div class="section-anchor__borders--left"></div>
          <div class="section-anchor__borders--right"></div>
        </div>
        <div class="section-anchor even hide">
          <button class="section-anchor__link" data-anchor="presentation">
            Présentation
          </button>
          <div class="section-anchor__borders--left"></div>
          <div class="section-anchor__borders--right"></div>
        </div>
        <div class="section-anchor odd hide">
          <button class="section-anchor__link" data-anchor="skills">
            Compétences
          </button>
          <div class="section-anchor__borders--left"></div>
          <div class="section-anchor__borders--right"></div>
        </div>
        <div class="section-anchor even hide">
          <button class="section-anchor__link" data-anchor="contact">
            Contact
          </button>
          <div class="section-anchor__borders--left"></div>
          <div class="section-anchor__borders--right"></div>
        </div>
      </nav>
    </header>

    <main></main>

    <footer>
      <div class="footer__silhouettes hide">
        <div class="sun"></div>
        <img
          src="./assets/THX1138.webp"
          alt="silhouette d'un homme devant le soleil couchant"
          class="Thx1138-silhouette"
        />
        <img
          src="./assets/footer_landscape.webp"
          alt="silhouette d'un paysage lointain de plaine"
          class="landscape-silouhette"
        />
        <img
          src="./assets/footer_caveman.webp"
          alt="silhouette d'un homme des caverne avec un gourdin"
          class="caveman-silhouette"
        />
      </div>
    </footer>
    <script type="module" src="./scripts/index.js"></script>
  </body>
</html>
