<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scroll Infini</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700;800&family=Raleway:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <h1>Clone <strong>Unsplash</strong></h1>
    <div class="global_container">
      <form class="input_container">
        <label for="search">Votre recherche</label>
        <input type="text" id="search" autocomplete="off" />
      </form>
      <p class="error_message"></p>
      <div class="photos_container"></div>
      <div class="intersection_watcher"></div>
    </div>
    <div class="returnToTop">
      <button type="button" class="topBtn">
        <img src="./images/arrow.svg" alt="return to top" />
      </button>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
